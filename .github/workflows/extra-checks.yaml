# Temporary, fork only: checks that no upstream workflow runs on this branch.
name: Extra checks
on:
  push:
    branches: [ci/extra-checks]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Vitest
        run: pnpm test
      - name: Typecheck and build
        run: pnpm build
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Build website (types and broken links)
        run: npm run build
  docs-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ai-context.py check
      - run: python3 scripts/release/release.py check
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l internal/version)"
      - run: go vet ./internal/version/
      - run: go test -count=1 ./internal/version/ ./internal/server/
      - run: go test -count=1 -run 'PyPI|Upgrade' ./cmd/skillshare/
